name: CI

on:
  pull_request:
  push:
    branches: [main]

# Standard: keinerlei Rechte. Jobs fordern nur an, was sie brauchen.
permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # nur Code auschecken
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren (nur gesperrte Versionen mit Hash)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (Python, inkl. Parität mit dem Dashboard)
        env:
          REQUIRE_NODE: "1" # Paritätstest darf in der CI nicht übersprungen werden
        run: python -m pytest

      - name: Tests (Dashboard-Logik, node:test)
        run: |
          node --version
          node --test tests/js/*.test.mjs

      - name: Shell-Skripte prüfen (shellcheck)
        run: shellcheck .github/scripts/*.sh

      - name: Workflow-Sicherheitsaudit (zizmor)
        run: zizmor --offline --persona=pedantic .github/workflows

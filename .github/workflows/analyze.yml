name: Analyze

on:
  schedule:
    # Rückfall: täglich 04:23 UTC. Im Normalfall ruft snapshot.yml die Analyse nach jedem
    # Snapshot-Stapel auf (alle ~5,5 h), weil GitHub geplante Läufe hier unzuverlässig ausführt.
    - cron: "23 4 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Code und Branch `data` lesen
    concurrency:
      group: analyze
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Historie lesen (schreibgeschützt). Fehlt der Branch noch, läuft die Analyse ohne Historie.
      - name: Branch data lesen
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: datadir
          persist-credentials: false
          sparse-checkout: |
            snapshots
            lists

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren (nur gesperrte Versionen mit Hash)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.txt

      - name: Einkaufsliste berechnen, Universum aktualisieren, Snapshots verdichten
        env:
          PYTHONPATH: src
        run: python -m gw2tp analyze --config config.yaml --data-dir datadir --out out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    # Einziger Job mit Schreibrecht. Führt nur das geprüfte Publish-Skript aus main aus,
    # keinen Python-Projektcode und keine Abhängigkeiten.
    name: publish
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Commit in den Branch `data`
    concurrency:
      group: data-branch # gemeinsam mit snapshot.yml: Schreibzugriffe nie gleichzeitig
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis
          path: incoming

      - name: In Branch data veröffentlichen
        env:
          TOKEN: ${{ github.token }}
        run: bash main/.github/scripts/publish-data.sh analyze incoming

  pages:
    # Dashboard mit der neuen Liste veröffentlichen. Die Rechte gelten nur für pages.yml.
    name: pages
    needs: publish
    concurrency:
      group: pages-call # eigener Name, damit sie nicht mit den Gruppen in pages.yml kollidiert
      cancel-in-progress: false
    permissions:
      contents: read # web/ und shopping-list.json lesen
      pages: write # Seite veröffentlichen
      id-token: write # OIDC-Token für deploy-pages
    # Bewährte Syntax für lokale Reusable Workflows; die von zizmor vorgeschlagene `$/`-Form
    # ist hier nicht verifiziert.
    uses: ./.github/workflows/pages.yml # zizmor: ignore[self-repository]

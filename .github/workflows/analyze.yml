name: Analyze

on:
  schedule:
    - cron: "23 4 * * *" # täglich 04:23 UTC (nicht zur vollen Stunde, weniger Verzögerung)
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Code und Branch `data` lesen
    concurrency:
      group: analyze
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Historie lesen (schreibgeschützt). Fehlt der Branch noch, läuft die Analyse ohne Historie.
      - name: Branch data lesen
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: datadir
          persist-credentials: false
          sparse-checkout: snapshots

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren (nur gesperrte Versionen mit Hash)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.txt

      - name: Einkaufsliste berechnen, Universum aktualisieren, Snapshots verdichten
        env:
          PYTHONPATH: src
        run: python -m gw2tp analyze --config config.yaml --data-dir datadir --out out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    # Einziger Job mit Schreibrecht. Führt nur das geprüfte Publish-Skript aus main aus,
    # keinen Python-Projektcode und keine Abhängigkeiten.
    name: publish
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Commit in den Branch `data`
    concurrency:
      group: data-branch # gemeinsam mit snapshot.yml: Schreibzugriffe nie gleichzeitig
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis
          path: incoming

      - name: In Branch data veröffentlichen
        env:
          TOKEN: ${{ github.token }}
        run: bash main/.github/scripts/publish-data.sh analyze incoming

name: Snapshot

on:
  schedule:
    # Dauerlauf: Jeder Lauf nimmt ca. 5,5 h lang alle 30 Minuten einen Snapshot auf und startet
    # am Ende selbst den nächsten (Job `continue`). Der Zeitplan ist nur der Rückfall, falls die
    # Kette einmal reißt: GitHub führt geplante Läufe für dieses Repo unzuverlässig aus. Läuft
    # noch ein Durchgang, wartet der nächste dank concurrency und schließt direkt an.
    - cron: "11 */2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  snapshot:
    name: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 355 # GitHub-Maximum sind 360 Minuten
    permissions:
      contents: read # Code und universe.json lesen
    concurrency:
      group: snapshot
      cancel-in-progress: false
    outputs:
      count: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nur universe.json aus dem Branch data. Fehlt sie, wird das Universum neu bestimmt.
      - name: Universum lesen
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: datadir
          persist-credentials: false
          sparse-checkout: /universe.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren (nur gesperrte Versionen mit Hash)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.txt

      - name: Snapshots im Dauerlauf erzeugen (330 Minuten, alle 30 Minuten)
        env:
          PYTHONPATH: src
        run: >-
          python -m gw2tp snapshot --config config.yaml --data-dir datadir --out out
          --repeat-for-min 330 --every-min 30

      - name: Snapshots zählen (Schutz der Selbstverkettung)
        id: count
        run: echo "count=$(find out -name '*.json.gz' -type f | wc -l)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: out/
          if-no-files-found: error
          retention-days: 3

  publish:
    # Einziger Job mit Schreibrecht. Führt nur das geprüfte Publish-Skript aus main aus.
    name: publish
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Commit in den Branch `data`
    concurrency:
      group: data-branch # gemeinsam mit analyze.yml: Schreibzugriffe nie gleichzeitig
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: incoming

      - name: In Branch data veröffentlichen
        env:
          TOKEN: ${{ github.token }}
        run: bash main/.github/scripts/publish-data.sh snapshot incoming

  analyze:
    # Einkaufsliste direkt mit den neuen Snapshots aktualisieren. Die Rechte gelten nur für
    # analyze.yml (und das darin aufgerufene pages.yml).
    name: analyze
    needs: publish
    concurrency:
      group: analyze-call # eigener Name, damit sie nicht mit den Gruppen in analyze.yml kollidiert
      cancel-in-progress: false
    permissions:
      contents: write # Einkaufsliste in den Branch `data` (nur der Publish-Job in analyze.yml)
      pages: write # Dashboard veröffentlichen (nur der Deploy-Job in pages.yml)
      id-token: write # OIDC-Token für deploy-pages
    uses: ./.github/workflows/analyze.yml # zizmor: ignore[self-repository]

  continue:
    # Selbstverkettung: Nach einem erfolgreichen Stapel sofort den nächsten Dauerlauf starten,
    # unabhängig von GitHubs unzuverlässigem Zeitplan. Schlägt ein Lauf fehl, endet die Kette und
    # der Zeitplan oben springt als Rückfall ein. Stoppen: Workflow in Actions deaktivieren.
    # Dieser Job führt keinen Projektcode aus und checkt nichts aus.
    name: continue
    needs: [snapshot, publish]
    # Nur nach einem echten Dauerlauf (≥ 6 Snapshots) weiterketten – verhindert eine Kette aus
    # Sekunden-Läufen, falls der Lauf vorzeitig endet.
    if: github.ref == 'refs/heads/main' && fromJSON(needs.snapshot.outputs.count) >= 6
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # nur zum Starten des nächsten Snapshot-Laufs (workflow_dispatch)
    concurrency:
      group: snapshot-continue
      cancel-in-progress: false
    steps:
      - name: Nächsten Dauerlauf starten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run snapshot.yml --repo "$REPO" --ref main

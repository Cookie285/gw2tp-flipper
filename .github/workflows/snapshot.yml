name: Snapshot

on:
  schedule:
    # Zweimal pro Stunde (Minute 7 und 37, abseits der vollen Stunde): GitHub verzögert geplante
    # Läufe bei Last und verwirft manche ganz. So kommen trotzdem etwa stündlich Daten an.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  snapshot:
    name: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # Code und universe.json lesen
    concurrency:
      group: snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nur universe.json aus dem Branch data. Fehlt sie, wird das Universum neu bestimmt.
      - name: Universum lesen
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: datadir
          persist-credentials: false
          sparse-checkout: /universe.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren (nur gesperrte Versionen mit Hash)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.txt

      - name: Snapshot erzeugen
        env:
          PYTHONPATH: src
        run: python -m gw2tp snapshot --config config.yaml --data-dir datadir --out out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: out/
          if-no-files-found: error
          retention-days: 3

  publish:
    # Einziger Job mit Schreibrecht. Führt nur das geprüfte Publish-Skript aus main aus.
    name: publish
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Commit in den Branch `data`
    concurrency:
      group: data-branch # gemeinsam mit analyze.yml: Schreibzugriffe nie gleichzeitig
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: incoming

      - name: In Branch data veröffentlichen
        env:
          TOKEN: ${{ github.token }}
        run: bash main/.github/scripts/publish-data.sh snapshot incoming
